<div class="container">
    <h1 class="mt-3">Category List</h1>

    <div class="d-flex justify-content-end mt-3">
        <a class="btn btn-primary" routerLink="/admin/category/add">Add
            Category</a>
    </div>
    <div>
        @if(isLoading()) {
        <p>Loading ...</p>
        } @else { @if(isError()) {
        <p style="color: red;">There has been an error ...</p>
        } @else{
        <table class="table table-bordered mt-3">
            <thead>
                <th>Id</th>
                <th>Name</th>
                <th>Url Handle</th>
            </thead>
            <tbody>
                @for(category of value(); track category.id){
                <tr>
                    <td>{{category.id}}</td>
                    <td>{{category.name}}</td>
                    <td>{{category.urlHandel}}</td>
                </tr>
                }
            </tbody>

        </table>
        } }
    </div>

</div>
