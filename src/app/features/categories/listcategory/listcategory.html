<div class="container">
    <h1 class="mt-3">Category List</h1>

    <div class="d-flex justify-content-end mt-3">
        <a class="btn btn-primary" routerLink="/admin/category/add">Add
            Category</a>
    </div>
    <p>@if(this.isLoading()) { - page is loading } @else { page loaded
        Successfully }
    </p>
    <div>
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Url Handle</th>
                </tr>
            </thead>
            <tbody>
                @for(c of category(); track $index) {
                <tr>
                    <td>{{c.id}}</td>
                    <td>{{c.name}}</td>
                    <td>{{c.urlHandel}}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
